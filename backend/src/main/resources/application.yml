spring:
  application:
    name: tournament-leaderboard
  threads:
    virtual:
      enabled: true
  mvc:
    problemdetails:
      # Errors are JSON problem details (RFC 9457): { "status": 404, "detail": "…" }
      enabled: true
  jpa:
    open-in-view: false
    hibernate:
      # Flyway owns the schema; Hibernate only checks that the entities match it.
      ddl-auto: validate

server:
  # Behind Caddy: build redirect URLs (Google sign-in) with https, not http.
  forward-headers-strategy: framework

management:
  endpoints:
    web:
      exposure:
        include: health, info
  endpoint:
    health:
      probes:
        enabled: true
