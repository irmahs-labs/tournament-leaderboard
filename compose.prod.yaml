# Production, on the shared irmahs.dev server in /srv/tournament-leaderboard. The deploy workflow
# writes .env (passwords, the Google client, the admins' emails) and runs it; the shared proxy (irmahs-labs/proxy) routes
# tournament-leaderboard.irmahs.dev to the app. See deploy/README.md.
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      # Owns the database and its tables; Flyway migrates as this role.
      POSTGRES_USER: leaderboard_owner
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      POSTGRES_DB: leaderboard
      # Read by db-init on the first start only, to create the app's own role.
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?set in .env}
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./deploy/db-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 15
    # Only on the internal network: nothing outside this app can reach the database.
    networks: [internal]

  app:
    build: .
    image: tournament-leaderboard
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/leaderboard
      SPRING_DATASOURCE_USERNAME: leaderboard_app
      SPRING_DATASOURCE_PASSWORD: ${APP_DB_PASSWORD:?set in .env}
      SPRING_FLYWAY_USER: leaderboard_owner
      SPRING_FLYWAY_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      # The production Google client; see deploy/README.md.
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:?set in .env}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:?set in .env}
      # Emails, so they're kept out of the repository: platform admins, and each organisation's
      # first members (slug:OWNER:email or slug:ADMIN:email), separated by commas.
      PLATFORM_ADMINS: ${PLATFORM_ADMINS:-}
      INITIAL_MEMBERS: ${INITIAL_MEMBERS:-}
      # Caddy serves HTTPS, so the session cookie is only ever sent over it.
      SERVER_SERVLET_SESSION_COOKIE_SECURE: "true"
      # The JVM sizes its heap from the container limit below; tune both here, no rebuild.
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=75
    mem_limit: 1g
    depends_on:
      db:
        condition: service_healthy
    # Publishes no port: Caddy reaches it on the proxy network as tournament-leaderboard:8080.
    networks:
      internal:
      proxy:
        aliases: [tournament-leaderboard]

networks:
  internal:
  proxy:
    external: true

volumes:
  db_data:
