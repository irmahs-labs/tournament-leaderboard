name: Deploy

# Run by CI (ci.yml) after the build and tests pass on a push to main, so nothing that failed them
# goes live. Before each deploy it dumps the database; after it, it checks the address through
# Caddy.
on:
  workflow_call:
  # Also by hand (Actions → Deploy → Run workflow), once this file is on the default branch.
  workflow_dispatch:

# Reads the repository and nothing else.
permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    steps:
      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          echo "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519

      - name: Deploy on server
        env:
          # The admin (owner) password and the app's own password; see deploy/README.md.
          POSTGRES_PASSWORD: ${{ secrets.TOURNAMENT_LEADERBOARD_ADMIN_POSTGRES_PASSWORD }}
          APP_DB_PASSWORD: ${{ secrets.TOURNAMENT_LEADERBOARD_POSTGRES_PASSWORD }}
          # The production Google client.
          GOOGLE_CLIENT_ID: ${{ secrets.TOURNAMENT_LEADERBOARD_GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.TOURNAMENT_LEADERBOARD_GOOGLE_CLIENT_SECRET }}
          # Repository variables, not secrets: emails, kept out of the code.
          PLATFORM_ADMINS: ${{ vars.TOURNAMENT_LEADERBOARD_PLATFORM_ADMINS }}
          INITIAL_MEMBERS: ${{ vars.TOURNAMENT_LEADERBOARD_INITIAL_MEMBERS }}
        run: |
          [ -n "$POSTGRES_PASSWORD" ] || { echo "Secret TOURNAMENT_LEADERBOARD_ADMIN_POSTGRES_PASSWORD is not set"; exit 1; }
          [ -n "$APP_DB_PASSWORD" ] || { echo "Secret TOURNAMENT_LEADERBOARD_POSTGRES_PASSWORD is not set"; exit 1; }
          [ -n "$GOOGLE_CLIENT_ID" ] || { echo "Secret TOURNAMENT_LEADERBOARD_GOOGLE_CLIENT_ID is not set"; exit 1; }
          [ -n "$GOOGLE_CLIENT_SECRET" ] || { echo "Secret TOURNAMENT_LEADERBOARD_GOOGLE_CLIENT_SECRET is not set"; exit 1; }
          # .env is sent over stdin so the secrets never appear in a command line.
          # Deploys exactly the commit the run was started on.
          printf 'POSTGRES_PASSWORD=%s\nAPP_DB_PASSWORD=%s\nGOOGLE_CLIENT_ID=%s\nGOOGLE_CLIENT_SECRET=%s\nPLATFORM_ADMINS=%s\nINITIAL_MEMBERS=%s\n' \
            "$POSTGRES_PASSWORD" "$APP_DB_PASSWORD" "$GOOGLE_CLIENT_ID" "$GOOGLE_CLIENT_SECRET" "$PLATFORM_ADMINS" "$INITIAL_MEMBERS" |
          ssh deploy@${{ secrets.DEPLOY_HOST }} 'set -e
            cd /srv/${{ github.event.repository.name }}
            [ -d .git ] || git clone https://github.com/${{ github.repository }}.git .
            git fetch --depth 1 origin ${{ github.sha }}
            git reset --hard FETCH_HEAD
            (umask 077 && cat > .env)
            export COMPOSE_FILE=compose.prod.yaml
            # A dump before every deploy, so a migration that goes wrong can be undone: the
            # last 14 are kept in backups/, readable by the deploy user only.
            if [ -n "$(docker compose ps -q db)" ]; then
              mkdir -p backups && chmod 700 backups
              dump="backups/$(date -u +%Y%m%dT%H%M%SZ)-${{ github.sha }}.dump"
              (umask 077 && docker compose exec -T db pg_dump -U leaderboard_owner -d leaderboard --format=custom > "$dump")
              [ -s "$dump" ] || { echo "The database dump is empty"; exit 1; }
              ls -1t backups/*.dump | tail -n +15 | xargs -r rm --
            fi
            # The new app next to the old one, then the old one stopped: no gap.
            ./deploy/rollout.sh
            docker image prune -f
            docker builder prune -f --filter until=168h'

      # The app is healthy inside the server; this checks that Caddy reaches it too, with its
      # certificate, as visitors do. From the server rather than this runner: Cloudflare turns
      # away requests from data centres such as GitHub's with a 403.
      - name: Check the address through Caddy
        run: |
          ssh deploy@${{ secrets.DEPLOY_HOST }} 'for _ in $(seq 1 12); do
              if docker run --rm --network host curlimages/curl:8.11.1 -fsS --max-time 10 \
                  --resolve tournament-leaderboard.irmahs.dev:443:127.0.0.1 \
                  https://tournament-leaderboard.irmahs.dev/actuator/health | grep -q "\"status\":\"UP\""; then
                echo "Healthy through Caddy at https://tournament-leaderboard.irmahs.dev"
                exit 0
              fi
              sleep 5
            done
            echo "Caddy does not reach a healthy app"
            exit 1'
