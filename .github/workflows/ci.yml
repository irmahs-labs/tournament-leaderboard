name: CI

on:
  push:
    branches: [main, dev, migration]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # A new push replaces a pull request's run, but never cuts off a branch's run: on migration
  # that run ends with a deploy, which must finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # SonarQube Cloud needs the history to tell new code from old

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # Angular build and tests, Java unit tests, integration tests on Testcontainers
      # (the runner has Docker), JaCoCo reports.
      - name: Build and test
        run: ./mvnw -B -ntp verify

      - name: Check compose.prod.yaml
        run: docker compose -f compose.prod.yaml config --quiet --no-interpolate

      # Runs once the SONAR_TOKEN secret exists. On pull requests and main it fails the job when
      # the quality gate fails; SonarQube Cloud won't give the gate of other branches (migration,
      # dev) on this plan, so their pushes send the analysis without waiting for it.
      - name: SonarQube Cloud
        if: ${{ env.SONAR_TOKEN != '' }}
        run: >-
          ./mvnw -B -ntp sonar:sonar
          -Dsonar.qualitygate.wait=${{ github.event_name == 'pull_request' || github.ref == 'refs/heads/main' }}

  # Every merge into migration that passed the build and tests goes live; see deploy.yml.
  deploy:
    name: Deploy
    needs: build
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/migration' }}
    uses: ./.github/workflows/deploy.yml
    secrets: inherit
